<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype &mdash; Jitterbit</title>
<style>
  :root {
    --navy: #1b3e51;
    --navy-deep: #14303f;
    --orange: #f54614;
    --ink: #1c1917;
    --soft: #6b6660;
    --rule: #e6e3e0;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 400 15px/1.55 "Roboto", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink);
    background: #ffffff;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  .ribbon { flex: 0 0 3px; background: var(--orange); }
  header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 18px;
    height: 64px;
    padding: 0 28px;
    background: #ffffff;
    border-bottom: 1px solid var(--rule);
  }
  .brand { display: block; line-height: 0; flex: 0 0 auto; }
  .brand:focus-visible { outline: 2px solid var(--navy); outline-offset: 4px; border-radius: 2px; }
  .logo { height: 26px; width: auto; display: block; }
  .divider { flex: 0 0 1px; align-self: stretch; margin: 18px 0; background: var(--rule); }
  h1 {
    flex: 1 1 auto;
    min-width: 0;
    margin: 0;
    font-size: 15px;
    font-weight: 500;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .btn {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border-radius: 6px;
    padding: 8px 13px;
    font: 500 13.5px/1 "Roboto", -apple-system, sans-serif;
    text-decoration: none;
    white-space: nowrap;
  }
  .btn-ghost { color: var(--soft); }
  .btn-ghost:hover { background: #f2f0ed; color: var(--navy); }
  .btn-solid { background: var(--navy); color: #ffffff; }
  .btn-solid:hover { background: var(--navy-deep); }
  .btn:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
  .frame-wrap { flex: 1 1 auto; min-height: 0; position: relative; }
  iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: #ffffff;
  }
  .message { padding: 56px 24px; text-align: center; color: var(--soft); }
  .message a { color: var(--navy); }
  .message code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px;
    background: #f0eeeb;
    padding: 2px 5px;
    border-radius: 3px;
  }
  @media (max-width: 560px) {
    header { padding: 0 14px; gap: 12px; height: 58px; }
    .logo { height: 22px; }
    .divider { display: none; }
  }
</style>
</head>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var name = params.get('p') || '';
  var admin = params.get('admin') === '1';

  var home = './' + (admin ? '?admin=1' : '');
  document.getElementById('back').href = home;
  document.getElementById('back-text').href = home;

  var safe = /^[A-Za-z0-9][A-Za-z0-9._-]*\.html$/.test(name) && name.indexOf('..') === -1;
  var wrap = document.getElementById('wrap');

  if (!safe) {
    document.getElementById('full').remove();
    wrap.innerHTML = '<p class="message">No prototype selected. Open this page as ' +
      '<code>view.html?p=file-name.html</code>, or pick one from the ' +
      '<a href="./">list of prototypes</a>.</p>';
    return;
  }

  var label = name.replace(/\.html$/i, '');
  document.title = label + ' \u2014 Jitterbit';
  document.getElementById('title').textContent = label;
  document.getElementById('full').href = name;

  var frame = document.createElement('iframe');
  frame.src = name;
  frame.title = label + ' prototype';
  frame.setAttribute('allow', 'clipboard-write');
  wrap.appendChild(frame);
})();
</script>
