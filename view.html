<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype</title>
<style>
  :root {
    --bar: #5a388a;
    --bar-text: #ffffff;
    --bar-height: 44px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 400 14px/1.4 "Roboto", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f5f7;
    display: flex;
    flex-direction: column;
  }
  header {
    flex: 0 0 var(--bar-height);
    height: var(--bar-height);
    background: var(--bar);
    color: var(--bar-text);
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 16px;
  }
  header h1 {
    margin: 0;
    flex: 1 1 auto;
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  header a {
    color: var(--bar-text);
    font-size: 13px;
    text-decoration: none;
    border: 1px solid rgba(255, 255, 255, 0.45);
    border-radius: 4px;
    padding: 5px 10px;
    white-space: nowrap;
    flex: 0 0 auto;
  }
  header a.plain { border-color: transparent; padding-left: 0; }
  header a:hover { background: rgba(255, 255, 255, 0.14); }
  header a:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .frame-wrap { flex: 1 1 auto; min-height: 0; position: relative; }
  iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: #ffffff;
  }
  .message {
    padding: 48px 24px;
    text-align: center;
    color: #57534e;
  }
  .message code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
    background: #ebeaee;
    padding: 2px 5px;
    border-radius: 3px;
  }
</style>
</head>
<body>
  <header>
    <a class="plain" href="./" title="All prototypes">&larr;</a>
    <h1 id="title">Prototype</h1>
    <a id="fullscreen" href="#" target="_blank" rel="noopener">Open full screen</a>
  </header>
  <div class="frame-wrap" id="wrap"></div>

<script>
(function () {
  var name = new URLSearchParams(location.search).get('p') || '';

  // Only a plain .html file name in this repository — no paths, no other origins.
  var safe = /^[A-Za-z0-9][A-Za-z0-9._-]*\.html$/.test(name) && name.indexOf('..') === -1;

  var wrap = document.getElementById('wrap');

  if (!safe) {
    document.getElementById('fullscreen').remove();
    wrap.innerHTML = '<p class="message">No prototype selected. Open this page as ' +
      '<code>view.html?p=file-name.html</code>, or pick one from the ' +
      '<a href="./">list of prototypes</a>.</p>';
    return;
  }

  var label = name.replace(/\.html$/, '');
  document.title = label;
  document.getElementById('title').textContent = label;
  document.getElementById('fullscreen').href = name;

  var frame = document.createElement('iframe');
  frame.src = name;
  frame.title = label + ' prototype';
  frame.setAttribute('allow', 'clipboard-write');
  wrap.appendChild(frame);
})();
</script>
</body>
</html>
